<aside class="info-bar" aria-label="Local information">
  <div class="container">
    <div class="info-bar-inner">
      <div class="info-bar-item info-bar-weather">
        <i class="bi bi-thermometer-half" aria-hidden="true"></i
        ><span class="weather-location">Batangas City</span
        ><span class="weather-temp">&lt;placeholder&gt;</span>
      </div>
      <div class="info-bar-item info-bar-rates">
        <span data-i18n="ui-exchange">PHP exchange rate</span
        ><span class="rate-display">&lt;placeholder&gt;</span>
      </div>
      <div class="info-bar-item info-bar-datetime">
        <i class="bi bi-clock" aria-hidden="true"></i><span class="date-value"></span
        ><span class="time-value"></span><span class="time-label">PHT</span>
      </div>
      <button
        class="live-toggle"
        type="button"
        data-live-toggle
        aria-pressed="false"
        data-i18n="ui-pause"
      >
        Pause updates
      </button>
    </div>
  </div>
</aside>
